name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      SVG_UI_RENDERER: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Validate plugin manifests are well-formed JSON
        run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]; print('json ok')"
      - name: Report the environment
        run: python skills/svg-ui-bridge/scripts/env_check.py
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Quick Edit browser test
        run: python tests/test_quick_edit.py
