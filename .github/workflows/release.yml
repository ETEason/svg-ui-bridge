name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  skill-zip:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      ZIP: dist/svg-ui-bridge-skill.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the skill zip
        run: python tools/build_skill_zip.py --expect-version "${TAG#v}"
      - name: Attach it to the GitHub Release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --verify-tag --generate-notes
          fi
