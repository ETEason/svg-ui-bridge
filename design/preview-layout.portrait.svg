<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844"
     data-screen="PreviewLayoutPortrait" data-target="mobile-390x844">
  <style>
    :root {
      --color-page: #f3f4f7; --color-panel: #ffffff; --color-text: #1d2230; --color-muted: #6b7280;
      --color-line: #e3e6ec; --color-select: #e0218a; --color-primary: #1d4ed8; --color-on-primary: #ffffff;
      --color-chip: #eef0f5; --color-grip: #b6bdcc; --color-stage: #0f1115; --color-stage-2: #20242d;
      --color-stage-3: #4f8cff; --radius-panel: 10px; --space-4: 16px;
    }
    text { font-family: system-ui, "Noto Sans TC", sans-serif; }
    .mono { font-family: ui-monospace, monospace; }
  </style>

  <g id="Page" data-component="Screen" data-layout="col"
     data-note="below 800px wide: no tree; the draft and Quick Edit share the window height and both stay on screen">
    <rect x="0" y="0" width="390" height="844" fill="var(--color-page)"/>

    <g id="Header" data-component="Toolbar" data-layout="wrap gap-8 pad-10-16">
      <rect x="0" y="0" width="390" height="50" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <text x="16" y="31" font-size="15" font-weight="700" fill="var(--color-text)">SVG Design Review</text>
      <rect x="196" y="12" width="104" height="28" rx="6" fill="var(--color-page)" stroke="var(--color-select)" stroke-width="2"/>
      <text x="206" y="31" font-size="12" fill="var(--color-text)">縮放 符合寬度 ▾</text>
      <text x="312" y="31" font-size="12" fill="var(--color-muted)">Quick Edit</text>
    </g>

    <g id="DraftPane" data-component="Card" data-layout="col scroll"
       data-note="the draft keeps its design size and layout; 符合寬度 scales it down uniformly, so nothing moves relative to anything else">
      <rect x="16" y="62" width="358" height="420" rx="10" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <text x="28" y="84" font-size="13" font-weight="600" fill="var(--color-text)">DocsSearch</text>
      <text x="108" y="84" font-size="11" fill="var(--color-muted)">desktop-1280x800 · 符合寬度 26%</text>
      <rect x="28" y="96" width="334" height="209" fill="var(--color-stage)"/>
      <rect x="28" y="96" width="334" height="15" fill="var(--color-stage-2)"/>
      <rect x="34" y="117" width="283" height="11" rx="2" fill="var(--color-stage-2)"/>
      <rect x="34" y="134" width="125" height="27" rx="3" fill="var(--color-stage-2)"/>
      <rect x="34" y="164" width="125" height="27" rx="3" fill="var(--color-stage-2)"/>
      <rect x="164" y="134" width="192" height="165" rx="3" fill="var(--color-stage-2)"/>
      <g id="SelectedOutline" data-component="Overlay">
        <rect x="320" y="117" width="36" height="11" rx="2" fill="var(--color-stage-3)"/>
        <rect x="318" y="115" width="40" height="15" fill="none" stroke="var(--color-select)" stroke-width="2"/>
        <rect x="309" y="106" width="14" height="12" rx="3" fill="var(--color-select)"/>
        <text x="316" y="115" font-size="9" font-weight="700" text-anchor="middle" fill="var(--color-on-primary)">1</text>
      </g>
      <text x="28" y="330" font-size="12" fill="var(--color-muted)">第二個畫面（mobile-390x844）在下方，捲動可見</text>
    </g>

    <g id="PortraitSplitter" data-component="Splitter" data-note="drag to share the height between draft and Quick Edit; remembered">
      <rect x="16" y="486" width="358" height="16" rx="4" fill="var(--color-page)"/>
      <rect x="175" y="492.5" width="40" height="3" rx="1.5" fill="var(--color-grip)"/>
    </g>

    <g id="QuickEditPanel" data-component="Panel" data-layout="col gap-8 pad-12"
       data-note="part of the layout, never over the draft; × closes it and the draft takes the full height">
      <rect x="16" y="506" width="358" height="322" rx="10" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <text x="30" y="530" font-size="14" font-weight="700" fill="var(--color-text)">Quick Edit</text>
      <text x="356" y="531" font-size="18" text-anchor="middle" fill="var(--color-muted)">×</text>
      <rect x="30" y="542" width="330" height="36" rx="6" fill="var(--color-panel)" stroke="var(--color-line)" stroke-dasharray="3 3"/>
      <rect x="35" y="547" width="112" height="26" rx="13" fill="var(--color-chip)"/>
      <text class="mono" x="45" y="564" font-size="12" fill="var(--color-text)">SearchButton</text>
      <text x="132" y="565" font-size="13" text-anchor="middle" fill="var(--color-muted)">×</text>
      <text class="mono" x="30" y="598" font-size="12" fill="var(--color-primary)">App › SearchBar › </text>
      <text class="mono" x="160" y="598" font-size="12" font-weight="700" fill="var(--color-text)">SearchButton</text>
      <rect x="30" y="610" width="330" height="140" rx="8" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <text x="42" y="632" font-size="13" fill="var(--color-muted)">描述你想怎麼改</text>
      <rect x="30" y="768" width="158" height="44" rx="8" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <text x="109" y="795" font-size="13" text-anchor="middle" fill="var(--color-text)">加入清單</text>
      <rect x="202" y="768" width="158" height="44" rx="8" fill="var(--color-primary)"/>
      <text x="281" y="795" font-size="13" font-weight="600" text-anchor="middle" fill="var(--color-on-primary)">Copy Prompt</text>
    </g>
  </g>
</svg>
