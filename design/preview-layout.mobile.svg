<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844"
     data-screen="PreviewLayoutMobile" data-target="mobile-390x844">
  <style>
    :root {
      --color-page: #f3f4f7; --color-panel: #ffffff; --color-text: #1d2230; --color-muted: #6b7280;
      --color-line: #e3e6ec; --color-select: #e0218a; --color-primary: #1d4ed8; --color-on-primary: #ffffff;
      --color-chip: #eef0f5; --color-grip: #b6bdcc; --color-stage: #0f1115; --color-stage-2: #20242d;
      --color-stage-3: #4f8cff; --radius-panel: 10px; --space-4: 16px;
    }
    text { font-family: system-ui, "Noto Sans TC", sans-serif; }
    .mono { font-family: ui-monospace, monospace; }
  </style>

  <g id="Page" data-component="Screen" data-layout="col scroll-y"
     data-note="below 800px everything stacks in page flow: design, then tree, then Quick Edit; nothing floats">
    <rect x="0" y="0" width="390" height="844" fill="var(--color-page)"/>
    <g id="Header" data-component="Toolbar" data-layout="wrap gap-8 pad-10-16">
      <rect x="0" y="0" width="390" height="50" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <text x="16" y="31" font-size="15" font-weight="700" fill="var(--color-text)">SVG Design Review</text>
      <text x="200" y="31" font-size="12" fill="var(--color-muted)">元件列 右側 ▾　Quick Edit</text>
    </g>
    <g id="DesignPane" data-component="Card" data-layout="col scroll-x">
      <rect x="16" y="62" width="358" height="330" rx="10" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <rect x="28" y="92" width="334" height="288" fill="var(--color-stage)"/>
      <rect x="44" y="112" width="190" height="40" rx="8" fill="var(--color-stage-2)"/>
      <rect x="244" y="112" width="102" height="40" rx="8" fill="var(--color-stage-3)"/>
      <text x="295" y="138" font-size="13" font-weight="600" text-anchor="middle" fill="var(--color-on-primary)">Search</text>
      <rect x="241" y="109" width="108" height="46" fill="none" stroke="var(--color-select)" stroke-width="2"/>
    </g>
    <g id="TreePanel" data-component="Panel" data-layout="col scroll-y fixed-358x120">
      <rect x="16" y="406" width="358" height="120" rx="10" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <text x="28" y="430" font-size="13" fill="var(--color-muted)">元件（滑過可定位）</text>
      <text class="mono" x="34" y="454" font-size="12" fill="var(--color-text)">App</text>
      <rect x="28" y="464" width="334" height="20" rx="4" fill="var(--color-select)"/>
      <text class="mono" x="46" y="478" font-size="12" fill="var(--color-on-primary)">SearchButton</text>
      <text class="mono" x="46" y="502" font-size="12" fill="var(--color-text)">Body</text>
    </g>
    <g id="QuickEditPanel" data-component="Panel" data-layout="col gap-8 pad-12">
      <rect x="16" y="540" width="358" height="288" rx="10" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <text x="30" y="566" font-size="14" font-weight="700" fill="var(--color-text)">Quick Edit</text>
      <text x="356" y="567" font-size="18" text-anchor="middle" fill="var(--color-muted)">×</text>
      <rect x="30" y="578" width="330" height="36" rx="6" fill="var(--color-panel)" stroke="var(--color-line)" stroke-dasharray="3 3"/>
      <rect x="34" y="583" width="118" height="26" rx="13" fill="var(--color-chip)"/>
      <text class="mono" x="44" y="600" font-size="12" fill="var(--color-text)">SearchButton ×</text>
      <rect x="158" y="583" width="104" height="26" rx="13" fill="var(--color-chip)"/>
      <text class="mono" x="168" y="600" font-size="12" fill="var(--color-text)">SearchInput ×</text>
      <text class="mono" x="30" y="636" font-size="12" fill="var(--color-primary)">App › SearchBar › </text>
      <text class="mono" x="148" y="636" font-size="12" font-weight="700" fill="var(--color-text)">SearchButton</text>
      <rect x="30" y="648" width="330" height="106" rx="8" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <text x="42" y="670" font-size="13" fill="var(--color-muted)">描述你想怎麼改</text>
      <rect x="30" y="768" width="158" height="44" rx="8" fill="var(--color-panel)" stroke="var(--color-line)"/>
      <text x="109" y="795" font-size="13" text-anchor="middle" fill="var(--color-text)">加入清單</text>
      <rect x="202" y="768" width="158" height="44" rx="8" fill="var(--color-primary)"/>
      <text x="281" y="795" font-size="13" font-weight="600" text-anchor="middle" fill="var(--color-on-primary)">Copy Prompt</text>
    </g>
  </g>
</svg>
