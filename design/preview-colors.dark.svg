<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800"
     data-screen="PreviewColorsDark" data-target="desktop-1280x800">
  <style>
    :root { --c-bg:#0b0d11;--c-panel:#151821;--c-text:#e8eaf0;--c-muted:#8b93a7;--c-line:#262b36;--c-grip:#5d6578;--c-chip:#262b36;--c-primary:#3563e9;--c-link:#6b8cff;--c-on:#ffffff;--c-sel:#d6177f;--c-hi:#d6177f;--c-tint:#3a1630;--c-halo:#ffffff;--c-ok:#22c55e;--c-tip:#111111;--c-tipid:#ff9ccf; --d-ink:#1e293b; --d-soft:#f8fafc; --d-edge:#e2e8f0; --d-red:#ef4444; --d-red-2:#dc2626; --d-red-3:#b91c1c; --d-sub:#64748b; }
    text { font-family: system-ui, "Noto Sans TC", sans-serif; }
    .mono { font-family: ui-monospace, monospace; }
  </style>
  <g id="Page" data-component="Screen" data-layout="col" data-note="深色: the review page with hover, two selections, the tooltip, tree and Quick Edit">
    <rect x="0" y="0" width="1280" height="800" fill="var(--c-bg)"/>
    <g id="Header" data-component="Toolbar" data-layout="row center gap-12 pad-10-16">
      <rect x="0" y="0" width="1280" height="50" fill="var(--c-panel)" stroke="var(--c-line)"/>
      <text x="16" y="31" font-size="15" font-weight="700" fill="var(--c-text)">SVG Design Review</text>
      <text x="170" y="31" font-size="13" fill="var(--c-muted)">狀態 default　縮放 符合寬度　元件列 右側　切換背景　Quick Edit</text>
      <text x="640" y="31" font-size="12" fill="var(--c-ok)">● 即時預覽中</text>
      <text x="1264" y="31" font-size="13" font-weight="700" text-anchor="end" fill="var(--c-muted)">深色</text>
    </g>
    <g id="DesignCard" data-component="Card" data-layout="col">
      <rect x="6" y="56" width="900" height="738" rx="10" fill="var(--c-panel)" stroke="var(--c-line)"/>
      <text x="18" y="82" font-size="14" font-weight="600" fill="var(--c-text)">Orders</text>
      <text x="76" y="82" font-size="12" fill="var(--c-muted)">orders.svg · desktop-1280x800 · 符合寬度 68%</text>
      <g id="Draft" data-component="Stage" data-note="a sample draft with red areas: an alert bar and delete buttons">
        <rect x="18" y="98" width="876" height="684" fill="#ffffff"/>
        <rect x="18" y="98" width="876" height="48" fill="var(--d-ink)"/>
        <text x="38" y="128" font-size="16" font-weight="700" fill="#ffffff">訂單管理</text>
        <rect x="38" y="166" width="836" height="56" rx="8" fill="var(--d-red)"/>
        <text x="58" y="199" font-size="14" font-weight="600" fill="#ffffff">付款服務中斷，部分訂單無法送出</text>
        <rect x="744" y="176" width="110" height="36" rx="6" fill="var(--d-red-3)"/>
        <text x="799" y="199" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">重試</text>
        <rect x="38" y="242" width="836" height="72" rx="8" fill="var(--d-soft)" stroke="var(--d-edge)"/>
        <text x="58" y="272" font-size="14" font-weight="600" fill="var(--d-ink)">訂單 #10231</text>
        <text x="58" y="294" font-size="12" fill="var(--d-sub)">王小明 · NT$ 1,280</text>
        <rect x="770" y="260" width="84" height="36" rx="6" fill="var(--d-red-2)"/>
        <text x="812" y="283" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">刪除</text>
        <rect x="38" y="330" width="836" height="72" rx="8" fill="var(--d-soft)" stroke="var(--d-edge)"/>
        <text x="58" y="360" font-size="14" font-weight="600" fill="var(--d-ink)">訂單 #10232</text>
        <text x="58" y="382" font-size="12" fill="var(--d-sub)">陳美玲 · NT$ 560</text>
        <rect x="770" y="348" width="84" height="36" rx="6" fill="var(--d-red-2)"/>
        <text x="812" y="371" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">刪除</text>
        <rect x="38" y="418" width="836" height="72" rx="8" fill="var(--d-soft)" stroke="var(--d-edge)"/>
        <text x="58" y="448" font-size="14" font-weight="600" fill="var(--d-ink)">訂單 #10233</text>
        <text x="58" y="470" font-size="12" fill="var(--d-sub)">林大同 · NT$ 3,400</text>
        <rect x="770" y="436" width="84" height="36" rx="6" fill="var(--d-red-2)"/>
        <text x="812" y="459" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">刪除</text>
      </g>
      <g id="Marks" data-component="Overlay" data-note="hover on the retry button, selection 1 on order 2, selection 2 on the delete button of order 3">
        <rect x="741" y="173" width="116" height="42" fill="none" stroke="var(--c-halo)" stroke-width="3.5"/><rect x="741" y="173" width="116" height="42" fill="none" stroke="var(--c-hi)" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="35" y="327" width="842" height="78" fill="none" stroke="var(--c-halo)" stroke-width="4"/><rect x="34" y="317" width="24" height="20" rx="5" fill="var(--c-halo)"/><rect x="35" y="327" width="842" height="78" fill="none" stroke="var(--c-sel)" stroke-width="2"/><rect x="35" y="318" width="22" height="18" rx="4" fill="var(--c-sel)"/><text x="46" y="331" font-size="11" font-weight="700" text-anchor="middle" fill="var(--c-on)">1</text><rect x="767" y="433" width="90" height="42" fill="none" stroke="var(--c-halo)" stroke-width="4"/><rect x="766" y="423" width="24" height="20" rx="5" fill="var(--c-halo)"/><rect x="767" y="433" width="90" height="42" fill="none" stroke="var(--c-sel)" stroke-width="2"/><rect x="767" y="424" width="22" height="18" rx="4" fill="var(--c-sel)"/><text x="778" y="437" font-size="11" font-weight="700" text-anchor="middle" fill="var(--c-on)">2</text>
      </g>
      <g id="Tooltip" data-component="Tooltip">
        <rect x="620" y="226" width="196" height="28" rx="6" fill="var(--c-tip)"/>
        <text class="mono" x="630" y="245" font-size="12" fill="var(--c-tipid)">#RetryButton</text>
        <text x="730" y="245" font-size="12" fill="#ffffff">Button</text>
      </g>
    </g>
    <g id="WidthSplitter" data-component="Splitter">
      <rect x="908" y="405" width="2" height="40" rx="1" fill="var(--c-grip)"/>
    </g>
    <g id="TreePanel" data-component="Panel" data-layout="col scroll-y">
      <rect x="912" y="56" width="362" height="300" rx="10" fill="var(--c-panel)" stroke="var(--c-line)"/>
      <text x="924" y="82" font-size="13" fill="var(--c-muted)">元件（滑過可定位）</text>
      <text class="mono" x="930" y="108" font-size="12" fill="var(--c-text)">App</text><text class="mono" x="942" y="130" font-size="12" fill="var(--c-text)">TopBar</text><text class="mono" x="942" y="152" font-size="12" fill="var(--c-text)">AlertBar</text><rect x="924" y="160" width="338" height="20" rx="4" fill="var(--c-chip)"/><text class="mono" x="954" y="174" font-size="12" fill="var(--c-text)">RetryButton</text><text class="mono" x="942" y="196" font-size="12" fill="var(--c-text)">OrderList</text><text class="mono" x="954" y="218" font-size="12" fill="var(--c-text)">OrderCard-1</text><rect x="924" y="226" width="338" height="20" rx="4" fill="var(--c-tint)"/><rect x="924" y="226" width="3" height="20" rx="1.5" fill="var(--c-sel)"/><text class="mono" x="954" y="240" font-size="12" font-weight="700" fill="var(--c-text)">OrderCard-2</text><text class="mono" x="954" y="262" font-size="12" fill="var(--c-text)">OrderCard-3</text><rect x="924" y="270" width="338" height="20" rx="4" fill="var(--c-tint)"/><rect x="924" y="270" width="3" height="20" rx="1.5" fill="var(--c-sel)"/><text class="mono" x="966" y="284" font-size="12" font-weight="700" fill="var(--c-text)">DeleteButton-3</text><text class="mono" x="966" y="306" font-size="12" fill="var(--c-text)">OrderCard-3-Title</text>
    </g>
    <g id="HeightSplitter" data-component="Splitter">
      <rect x="1073" y="358" width="40" height="2" rx="1" fill="var(--c-grip)"/>
    </g>
    <g id="QuickEditPanel" data-component="Panel" data-layout="col gap-8 pad-12">
      <rect x="912" y="362" width="362" height="432" rx="10" fill="var(--c-panel)" stroke="var(--c-line)"/>
      <text x="926" y="388" font-size="14" font-weight="700" fill="var(--c-text)">Quick Edit</text>
      <text x="1258" y="389" font-size="18" text-anchor="middle" fill="var(--c-muted)">×</text>
      <rect x="926" y="402" width="334" height="40" rx="6" fill="var(--c-panel)" stroke="var(--c-line)" stroke-dasharray="3 3"/>
      <rect x="931" y="409" width="112" height="26" rx="13" fill="var(--c-chip)"/>
      <text class="mono" x="941" y="426" font-size="12" fill="var(--c-text)">OrderCard-2</text>
      <text x="1028" y="427" font-size="13" text-anchor="middle" fill="var(--c-muted)">×</text>
      <rect x="1049" y="409" width="126" height="26" rx="13" fill="var(--c-chip)"/>
      <text class="mono" x="1059" y="426" font-size="12" fill="var(--c-text)">DeleteButton-3</text>
      <text x="1160" y="427" font-size="13" text-anchor="middle" fill="var(--c-muted)">×</text>
      <text class="mono" x="926" y="462" font-size="12" fill="var(--c-link)">App › OrderList › OrderCard-3 › </text>
      <text class="mono" x="1149" y="462" font-size="12" font-weight="700" fill="var(--c-text)">DeleteButton-3</text>
      <rect x="926" y="474" width="334" height="254" rx="8" fill="var(--c-panel)" stroke="var(--c-primary)" stroke-width="2"/>
      <text x="938" y="498" font-size="13" fill="var(--c-text)">刪除鈕改成次要樣式，避免和警示列搶注意力</text>
      <text x="926" y="764" font-size="12" font-weight="600" fill="var(--c-ok)">已複製</text>
      <rect x="1038" y="740" width="100" height="40" rx="8" fill="var(--c-panel)" stroke="var(--c-line)"/>
      <text x="1088" y="765" font-size="13" text-anchor="middle" fill="var(--c-text)">加入清單</text>
      <rect x="1146" y="740" width="114" height="40" rx="8" fill="var(--c-primary)"/>
      <text x="1203" y="765" font-size="13" font-weight="600" text-anchor="middle" fill="var(--c-on)">Copy Prompt</text>
    </g>
  </g>
</svg>
